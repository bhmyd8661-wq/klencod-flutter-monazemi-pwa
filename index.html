<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090c" id="metaTheme">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="منظمي — تطبيق يساعدك على تنظيم يومك وإدارة مهامك ومتابعة تقدمك وتحسين تركيزك.">
<title>منظمي — وقتك.. أسلوب حياتك</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2307090c'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%2310b981' stroke-width='5'/%3E%3Cpath d='M32 22v11l7 4' fill='none' stroke='%23eef2f6' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<!-- الخط اختياري: عند انقطاع الإنترنت يُستخدم أقرب خط عربي متوفر على الجهاز -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* ============ المتغيرات والألوان ============ */
:root{
  --bg:#07090c; --card:#12161b; --card2:#1a2027; --border:#242c35;
  --text:#eef2f6; --muted:#93a0ae;
  --green:#10b981; --green-soft:rgba(16,185,129,.15);
  --blue:#3b82f6; --blue-soft:rgba(59,130,246,.15);
  --orange:#f59e0b; --orange-soft:rgba(245,158,11,.15);
  --red:#ef4444; --red-soft:rgba(239,68,68,.15);
  --violet:#8b5cf6; --violet-soft:rgba(139,92,246,.15);
  --shadow:0 6px 20px rgba(0,0,0,.35);
  --radius:18px; --btn-h:48px;
}
[data-theme="light"]{
  --bg:#f3f5f8; --card:#ffffff; --card2:#eef1f5; --border:#dbe2ea;
  --text:#11181f; --muted:#576575;
  --green:#059669; --green-soft:rgba(5,150,105,.12);
  --blue:#2563eb; --blue-soft:rgba(37,99,235,.12);
  --orange:#d97706; --orange-soft:rgba(217,119,6,.13);
  --red:#dc2626; --red-soft:rgba(220,38,38,.11);
  --violet:#7c3aed; --violet-soft:rgba(124,58,237,.11);
  --shadow:0 6px 18px rgba(20,30,50,.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:'Cairo','Tajawal','Noto Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  background:var(--bg);color:var(--text);font-size:16px;line-height:1.6;overflow:hidden;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.muted{color:var(--muted)} .sm{font-size:.85rem} .xs{font-size:.75rem} .grow{flex:1;min-width:0}
.ico{display:inline-flex;flex-shrink:0;align-items:center;justify-content:center}
.ico svg{display:block}
[hidden]{display:none!important}

/* ============ الهيكل ============ */
#app{height:100vh;height:100dvh;max-width:640px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}
#screens{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(16px + env(safe-area-inset-top)) 16px 32px;display:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.screen.active{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
#nav{display:flex;gap:4px;background:var(--card);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom));flex-shrink:0}
.nav-btn{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:.74rem;font-weight:600;border-radius:14px;position:relative;transition:background .2s,color .2s}
.nav-btn[aria-current="page"]{color:var(--green);background:var(--green-soft)}
.nav-dot{position:absolute;top:7px;inset-inline-start:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--card)}
#banner{background:var(--red-soft);color:var(--text);border-bottom:1px solid var(--red);padding:10px 14px;font-size:.88rem;display:flex;gap:10px;align-items:center}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .3s}
#splash.out{opacity:0;pointer-events:none}
.splash-logo{width:84px;height:84px;border-radius:24px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--green);box-shadow:var(--shadow)}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--green);animation:spin .8s linear infinite;margin-top:10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ مكونات عامة ============ */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.flex{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:48px}
.page-head h1{font-size:1.35rem;font-weight:800;flex:1}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 2px}
.section-head h2{font-size:1.05rem;font-weight:700}
.link-btn{color:var(--green);font-weight:600;font-size:.9rem;min-height:40px;padding:0 6px}
.btn{min-height:var(--btn-h);padding:0 18px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;background:var(--card2);border:1px solid var(--border);transition:transform .1s,background .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--green);border-color:var(--green);color:#04130d}
.btn.danger{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.btn.blue{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{width:46px;height:46px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border);flex-shrink:0}
.icon-btn:active{transform:scale(.94)}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:.88rem;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip .cnt{font-size:.72rem;background:var(--card2);border-radius:999px;padding:0 7px;min-width:22px;text-align:center}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;padding:1px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.badge.green{background:var(--green-soft);color:var(--green)} .badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.orange{background:var(--orange-soft);color:var(--orange)} .badge.red{background:var(--red-soft);color:var(--red)}
.badge.violet{background:var(--violet-soft);color:var(--violet)} .badge.gray{background:var(--card2);color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block}
.dot.green{background:var(--green)} .dot.blue{background:var(--blue)} .dot.red{background:var(--red)} .dot.orange{background:var(--orange)} .dot.violet{background:var(--violet)}
.empty{text-align:center;padding:28px 18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ico-wrap{width:64px;height:64px;border-radius:20px;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center}
.empty h3{font-size:1.1rem}
.seg{display:flex;background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border-radius:10px;color:var(--muted);font-weight:700;font-size:.9rem}
.seg button[aria-selected="true"]{background:var(--green);color:#04130d}

/* ============ النماذج ============ */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.label{font-weight:700;font-size:.92rem}
.input{width:100%;min-height:48px;padding:10px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--border);outline:none;transition:border-color .2s}
.input:focus{border-color:var(--green)}
.input[aria-invalid="true"]{border-color:var(--red)}
textarea.input{min-height:86px;resize:vertical}
.err{color:var(--red);font-size:.82rem;min-height:0}
.hint{color:var(--muted);font-size:.8rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border);min-height:56px}
.row:last-child{border-bottom:0}
.row-txt{flex:1;min-width:0}
.row-title{font-weight:700}
.row-desc{color:var(--muted);font-size:.82rem}
.switch{width:54px;height:32px;border-radius:999px;background:var(--card2);border:1px solid var(--border);position:relative;flex-shrink:0;transition:background .2s}
.switch .knob{position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch[aria-checked="true"]{background:var(--green-soft);border-color:var(--green)}
.switch[aria-checked="true"] .knob{background:var(--green);transform:translateX(-22px)}
.num-in{width:92px;min-height:44px;text-align:center}
.menu-row{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 14px;width:100%;text-align:start}
.menu-row .ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--green-soft);color:var(--green)}

/* ============ الرئيسية ============ */
.home-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.greet{font-size:1.45rem;font-weight:800;line-height:1.3}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.05rem;color:var(--green);background:var(--green-soft);padding:4px 12px;border-radius:12px;white-space:nowrap}
.ring{position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ring svg{position:absolute;inset:0}
.ring .bar{transition:stroke-dashoffset .8s ease}
.ring-txt{font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums}
.progress-card{display:flex;align-items:center;gap:18px}
.stat-list{flex:1;display:flex;flex-direction:column;gap:6px}
.stat-row{display:flex;align-items:center;gap:8px;font-size:.95rem}
.stat-row b{font-variant-numeric:tabular-nums}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quote{background:linear-gradient(135deg,var(--green-soft),transparent);border-color:var(--green);font-weight:600}

/* ============ المهام ============ */
.task{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:10px 12px;border-inline-start:4px solid var(--violet)}
.task.st-inprogress{border-inline-start-color:var(--blue)}
.task.st-done{border-inline-start-color:var(--green)}
.task.overdue{border-inline-start-color:var(--red);background:linear-gradient(90deg,var(--red-soft),var(--card) 60%)}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.task-body{flex:1;min-width:0;text-align:start;min-height:52px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.t-title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.78rem;color:var(--muted)}
.check{width:34px;height:34px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;color:transparent;flex-shrink:0;transition:all .2s;position:relative}
.check::after{content:"";position:absolute;inset:-8px}
.check.on{background:var(--green);border-color:var(--green);color:#04130d}
.list{display:flex;flex-direction:column;gap:10px}
.search{position:relative}
.search .input{padding-inline-start:44px}
.search .ico{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.fab{position:fixed;inset-inline-start:max(18px,calc(50% - 320px + 18px));bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;background:var(--green);color:#04130d;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(16,185,129,.4);z-index:5}
.fab:active{transform:scale(.94)}

/* ============ الجدول الزمني ============ */
.date-nav{display:flex;align-items:center;gap:8px}
.date-nav .mid{flex:1;text-align:center;font-weight:700;line-height:1.3}
.sum-line{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.free-chip{min-height:40px;padding:0 12px;border-radius:12px;background:var(--green-soft);border:1px dashed var(--green);color:var(--green);font-size:.82rem;font-weight:700}
.tl{position:relative;margin-top:12px;border-radius:16px;background:var(--card);border:1px solid var(--border);overflow:hidden}
.tl-hr{position:absolute;inset-inline-start:0;width:60px;text-align:center;font-size:.72rem;color:var(--muted);transform:translateY(-.55em);font-variant-numeric:tabular-nums}
.tl-line{position:absolute;inset-inline-start:60px;inset-inline-end:0;height:1px;background:var(--border)}
.tl-events{position:absolute;inset-inline-start:64px;inset-inline-end:6px;top:0;bottom:0}
.tl-free{position:absolute;inset-inline-start:0;inset-inline-end:0;background:repeating-linear-gradient(135deg,var(--green-soft) 0 8px,transparent 8px 16px);border-radius:10px;pointer-events:none;display:flex;align-items:center;justify-content:center;color:var(--green);font-size:.72rem;font-weight:700;opacity:.9}
.ev{position:absolute;border-radius:12px;padding:4px 8px;text-align:start;overflow:hidden;background:var(--violet-soft);border:1px solid var(--violet);color:var(--text);font-size:.8rem;line-height:1.3;display:flex;flex-direction:column;gap:1px}
.ev.st-inprogress{background:var(--blue-soft);border-color:var(--blue)}
.ev.st-done{background:var(--green-soft);border-color:var(--green);opacity:.85}
.ev.overdue{background:var(--red-soft);border-color:var(--red)}
.ev.conflict{border-style:dashed;box-shadow:0 0 0 2px var(--orange)}
.ev b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev span{color:var(--muted);font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-now{position:absolute;inset-inline-start:52px;inset-inline-end:0;height:2px;background:var(--red);z-index:3;pointer-events:none}
.tl-now::before{content:"";position:absolute;inset-inline-start:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--red)}

/* ============ المؤقت ============ */
.timer-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.timer-ring{position:relative;width:min(78vw,300px);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer-ring svg{position:absolute;inset:0;width:100%;height:100%}
.timer-ring .bar{transition:stroke-dashoffset 1s linear}
.t-time{font-size:3.2rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;direction:ltr;line-height:1.1}
.t-mode{color:var(--muted);font-weight:600}
.t-main{width:84px;height:84px;border-radius:50%;background:var(--green);color:#04130d;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 26px rgba(16,185,129,.4)}
.t-main:active{transform:scale(.94)}
.t-controls{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.cycle-dots{display:flex;gap:8px}
.cycle-dots i{width:12px;height:12px;border-radius:50%;background:var(--card2);border:1px solid var(--border)}
.cycle-dots i.on{background:var(--green);border-color:var(--green)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.kpi .card{padding:12px;text-align:center}
.kpi b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}

/* ============ الإحصائيات ============ */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:9px;font-family:inherit}
.chart .lbl{font-size:10px}
.hbar{display:flex;align-items:center;gap:10px;font-size:.88rem;margin:8px 0}
.hbar .nm{width:76px;flex-shrink:0}
.hbar .tr{flex:1;height:10px;border-radius:99px;background:var(--card2);overflow:hidden}
.hbar .fl{height:100%;border-radius:99px;background:var(--green)}
.hbar b{width:28px;text-align:end;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.kv div{background:var(--card2);border-radius:14px;padding:10px 4px}
.kv b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);margin-top:6px}
.log-item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:.88rem}
.log-item:last-child{border-bottom:0}

/* ============ الطبقات (النوافذ) ============ */
#layers{position:relative;z-index:50}
.overlay{position:fixed;left:0;right:0;top:0;height:100vh;height:var(--vvh,100dvh);background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.overlay.show{opacity:1}
.overlay.dialog{align-items:center;padding:20px}
.sheet{width:100%;max-width:640px;max-height:calc(var(--vvh,100dvh) - 12px);overflow-y:auto;background:var(--card);border:1px solid var(--border);border-bottom:0;border-radius:26px 26px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(24px);transition:transform .25s ease;overscroll-behavior:contain}
.overlay.show .sheet{transform:none}
.dialog-box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet-head h2{flex:1;font-size:1.2rem;font-weight:800}
.sheet-grab{width:42px;height:4px;border-radius:9px;background:var(--border);margin:-4px auto 10px}
.sticky-actions{position:sticky;bottom:-18px;background:linear-gradient(transparent,var(--card) 20%);padding-top:14px;display:flex;gap:10px}
.sticky-actions .btn{flex:1}
#toasts{position:fixed;inset-inline:0;bottom:calc(86px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none;padding:0 14px}
.toast{pointer-events:auto;max-width:520px;width:100%;display:flex;align-items:center;gap:10px;background:var(--card2);color:var(--text);border:1px solid var(--border);border-inline-start:4px solid var(--green);padding:10px 14px;border-radius:14px;box-shadow:var(--shadow);font-size:.92rem;animation:fade .25s ease}
.toast.warn{border-inline-start-color:var(--orange)} .toast.error{border-inline-start-color:var(--red)} .toast.info{border-inline-start-color:var(--blue)}
.toast button{color:var(--green);font-weight:700;min-height:36px;padding:0 6px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
@media (max-width:360px){
  .t-time{font-size:2.7rem} .greet{font-size:1.25rem} .grid2{gap:8px}
}
</style>
</head>
<body>
<noscript><p style="padding:24px;text-align:center">يحتاج تطبيق «منظمي» إلى تفعيل JavaScript ليعمل.</p></noscript>

<div id="splash" role="status" aria-live="polite">
  <div class="splash-logo" id="splashLogo"></div>
  <h1 style="font-size:2rem;font-weight:800">منظمي</h1>
  <p class="muted">وقتك.. أسلوب حياتك</p>
  <div class="spinner" aria-hidden="true"></div>
</div>

<div id="app" hidden>
  <div id="banner" role="alert" hidden></div>
  <div id="screens">
    <section class="screen" id="screen-home" aria-label="الرئيسية"></section>
    <section class="screen" id="screen-tasks" aria-label="المهام"></section>

/* ---------- 2) أدوات عامة ---------- */
const $ = (s, r=document) => r.querySelector(s);

const pad = n => String(n).padStart(2,'0');
const uid = () => (typeof crypto!=='undefined' && crypto.randomUUID) ? crypto.randomUUID()
  : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2,10);
const dateKey = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function parseDateKey(k){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(k||''); if(!m) return null;
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  return (d.getFullYear()===+m[1] && d.getMonth()===+m[2]-1 && d.getDate()===+m[3]) ? d : null;
}
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const startOfDay = d => { const x=new Date(d); x.setHours(0,0,0,0); return x; };
function parseTime(t){
  const m = /^(\d{2}):(\d{2})$/.exec(t||''); if(!m) return null;
  const h=+m[1], mi=+m[2]; return (h<24 && mi<60) ? h*60+mi : null;
}
const minToStr = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
function dueTs(t){
  if(!t.dueDate) return null;
  const d = parseDateKey(t.dueDate); if(!d) return null;
  const tm = parseTime(t.dueTime);
  if(tm==null) d.setHours(23,59,59,999); else d.setHours(Math.floor(tm/60), tm%60, 0, 0);
  return d.getTime();
}
const norm = s => String(s||'').toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
function fmtMin(min){
  min = ((Math.round(min)%1440)+1440)%1440;
  const h24=Math.floor(min/60), m=min%60;
  if(S.settings.clock24) return `${pad(h24)}:${pad(m)}`;
  return `${h24%12||12}:${pad(m)} ${h24<12?'ص':'م'}`;
}
const fmtTimeStr = t => { const m=parseTime(t); return m==null ? '' : fmtMin(m); };
function fmtClock(d){
  if(S.settings.clock24) return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  return `${d.getHours()%12||12}:${pad(d.getMinutes())}:${pad(d.getSeconds())} ${d.getHours()<12?'ص':'م'}`;
}
function fmtDur(min){
  min = Math.max(0, Math.round(min));
  if(min<60) return `${min} د`;
  const h=Math.floor(min/60), m=min%60; return m ? `${h}س ${m}د` : `${h} س`;
}
const fmtMs = ms => { const s=Math.max(0,Math.ceil(ms/1000)); return `${pad(Math.floor(s/60))}:${pad(s%60)}`; };
const dateLabel = d => `${DAYS[d.getDay()]}، ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
function relDay(key){
  const d=parseDateKey(key); if(!d) return '';
  const diff = Math.round((startOfDay(d)-startOfDay(new Date()))/864e5);
  if(diff===0) return 'اليوم'; if(diff===1) return 'غدًا'; if(diff===-1) return 'أمس';
  return `${d.getDate()} ${MONTHS[d.getMonth()]}`;
}
function fmtStamp(ts){ const d=new Date(ts); return `${d.getDate()} ${MONTHS[d.getMonth()]}، ${fmtMin(d.getHours()*60+d.getMinutes())}`; }
const clamp = (v,a,b) => Math.min(b,Math.max(a,v));

/* إنشاء عناصر DOM بأمان: النصوص تُضاف دائمًا كنص (textContent) وليس HTML */
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if(props) for(const k in props){
    const v = props[k];
    if(v===null || v===undefined || v===false) continue;
    if(k==='class') el.className = v;
    else if(k==='text') el.textContent = v;
    else if(k==='style') el.style.cssText = v;
    else if(k==='value'||k==='checked'||k==='disabled'||k==='selected') el[k] = v;
    else if(k.length>2 && k.startsWith('on') && typeof v==='function') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v===true ? '' : String(v));
  }
  appendKids(el, kids); return el;
}
function appendKids(el, kids){
  for(const k of kids){
    if(k===null || k===undefined || k===false) continue;
    if(Array.isArray(k)) appendKids(el,k);
    else if(k instanceof Node) el.appendChild(k);
    else el.appendChild(document.createTextNode(String(k)));
  }
}
function sv(tag, attrs, ...kids){
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if(attrs) for(const k in attrs) el.setAttribute(k, attrs[k]);
  appendKids(el, kids); return el;
}

/* أيقونات SVG مضمّنة (ثابتة وموثوقة، لا تحتوي بيانات المستخدم) */

function icon(name, size=22, cls=''){

  return s;

/* ---------- 3) التخزين: IndexedDB ثم localStorage ثم الذاكرة ---------- */
const Store = (() => {
  let db = null, mode = 'mem';
  const mem = {tasks:[], sessions:[], kv:[]};
  const KEYPATH = {tasks:'id', sessions:'id', kv:'key'};
  const lsRead = s => { try{ const v=JSON.parse(localStorage.getItem(LS_PREFIX+s)||'[]'); return Array.isArray(v)?v:[]; }catch{ return []; } };
  const lsWrite = (s,a) => localStorage.setItem(LS_PREFIX+s, JSON.stringify(a));
  function openIDB(){
    return new Promise((res,rej) => {
      if(!('indexedDB' in window)) return rej(new Error('IndexedDB غير مدعوم'));
      let req; try{ req = indexedDB.open(DB_NAME, DB_VER); }catch(e){ return rej(e); }
      req.onupgradeneeded = () => {
        const d = req.result;
        if(!d.objectStoreNames.contains('tasks')) d.createObjectStore('tasks',{keyPath:'id'});
        if(!d.objectStoreNames.contains('sessions')) d.createObjectStore('sessions',{keyPath:'id'});
        if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv',{keyPath:'key'});
      };
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error || new Error('فشل فتح قاعدة البيانات'));
      req.onblocked = () => rej(new Error('قاعدة البيانات محجوبة'));
    });
  }
  const tx = (store, rw, fn) => new Promise((res,rej) => {
    let t, out;
    try{ t = db.transaction(store, rw); out = fn(t.objectStore(store)); }catch(e){ return rej(e); }
    t.oncomplete = () => res(out && 'result' in out ? out.result : undefined);
    t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('أُلغيت العملية'));
  });
  return {
    get mode(){ return mode; },
    async init(){
      try{ db = await openIDB(); mode = 'idb'; }
      catch(e){
        try{ localStorage.setItem(LS_PREFIX+'probe','1'); localStorage.removeItem(LS_PREFIX+'probe'); mode='ls'; }
        catch{ mode='mem'; }
      }
      return mode;
    },
    async getAll(s){ if(mode==='idb') return (await tx(s,'readonly',o=>o.getAll()))||[]; if(mode==='ls') return lsRead(s); return mem[s].slice(); },
    async put(s,obj){
      if(mode==='idb') return tx(s,'readwrite',o=>o.put(obj));
      const k=KEYPATH[s], arr = mode==='ls' ? lsRead(s) : mem[s];
      const i = arr.findIndex(x=>x[k]===obj[k]); if(i>=0) arr[i]=obj; else arr.push(obj);
      if(mode==='ls') lsWrite(s,arr);
    },
    async del(s,id){
      if(mode==='idb') return tx(s,'readwrite',o=>o.delete(id));
      const k=KEYPATH[s]; const arr=(mode==='ls'?lsRead(s):mem[s]).filter(x=>x[k]!==id);
      if(mode==='ls') lsWrite(s,arr); else mem[s]=arr;
    },
    async replaceAll(s,arr){
      if(mode==='idb') return tx(s,'readwrite',o=>{ o.clear(); arr.forEach(x=>o.put(x)); });
      if(mode==='ls') lsWrite(s,arr); else mem[s]=arr.slice();
    },
    async clearAll(){ for(const s of ['tasks','sessions','kv']) await this.replaceAll(s,[]); }
  };
})();

/* ---------- 4) الحالة والتحقق من البيانات ---------- */
const S = {
  tasks:[], sessions:[], settings:{...DEFAULT_SETTINGS}, timer:null,
  ui:{screen:'home', taskFilter:'all', taskSort:'due', taskQuery:'', schedDate:dateKey(), statsPeriod:'week'}
};
const ENUM = (v,obj,def) => (typeof v==='string' && Object.prototype.hasOwnProperty.call(obj,v)) ? v : def;
const str = (v,max) => typeof v==='string' ? v.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').slice(0,max) : '';
const num = (v,min,max,def) => { v=Number(v); return (v!==null && Number.isFinite(v)) ? clamp(Math.round(v),min,max) : def; };
const MAXTS = 8.64e15;

function normalizeTask(t){
  if(!t || typeof t!=='object') return null;
  const title = str(t.title,120).trim(); if(!title) return null;
  const id = (typeof t.id==='string' && /^[\w-]{1,64}$/.test(t.id)) ? t.id : uid();
  const dueDate = parseDateKey(t.dueDate) ? t.dueDate : '';
  const dueTime = (dueDate && parseTime(t.dueTime)!=null) ? t.dueTime : '';
  const status = ENUM(t.status, STATUS, 'new');
  const r = (t.reminder && typeof t.reminder==='object') ? t.reminder : {};
  const rb = (r.before===null || r.before===undefined || r.before==='') ? null : num(r.before,1,10080,null);
  const f = (t.fired && typeof t.fired==='object') ? t.fired : {};
  return {
    id, title, description:str(t.description,1000).trim(), status,
    priority:ENUM(t.priority,PRIORITIES,'medium'), category:ENUM(t.category,CATEGORIES,'other'),
    createdAt:num(t.createdAt,0,MAXTS,Date.now()),
    completedAt: status==='done' ? num(t.completedAt,0,MAXTS,Date.now()) : null,
    dueDate, dueTime, duration:num(t.duration,1,1440,30),
    reminder:{before: dueTime ? rb : null, atTime: !!(dueTime && r.atTime)},
    fired:{before:!!f.before, at:!!f.at}, snoozedUntil:num(t.snoozedUntil,0,MAXTS,0), sample:!!t.sample
  };
}
function normalizeSession(s){
  if(!s || typeof s!=='object') return null;
  const endedAt = num(s.endedAt,0,MAXTS,0); if(!endedAt) return null;
  return {
    id:(typeof s.id==='string' && /^[\w-]{1,64}$/.test(s.id)) ? s.id : uid(),
    taskId:(typeof s.taskId==='string' && /^[\w-]{1,64}$/.test(s.taskId)) ? s.taskId : null,
    startedAt:num(s.startedAt,0,MAXTS,endedAt), endedAt, minutes:num(s.minutes,1,600,25)
  };
}
function normalizeSettings(s){
  s = (s && typeof s==='object') ? s : {}; const d = DEFAULT_SETTINGS;
  return {
    userName:str(s.userName,30).trim(), theme:s.theme==='light'?'light':'dark',
    soundOn:s.soundOn!==false, remindersOn:s.remindersOn!==false, notificationsOn:!!s.notificationsOn,
    focusMin:num(s.focusMin,1,180,d.focusMin), shortMin:num(s.shortMin,1,60,d.shortMin),
    longMin:num(s.longMin,1,90,d.longMin), longEvery:num(s.longEvery,2,10,d.longEvery),
    autoStart:!!s.autoStart, weekStart:[0,1,6].includes(Number(s.weekStart))?Number(s.weekStart):6,
    clock24:!!s.clock24, showClock:s.showClock!==false, keepAwake:!!s.keepAwake
  };
}

/* ---------- 5) الحفظ وإدارة الأخطاء ---------- */
let bannerShown = false;
function showBanner(msg){
  const b=$('#banner'); b.replaceChildren(h('span',{class:'grow'},msg),
    h('button',{class:'link-btn',type:'button','aria-label':'إخفاء التنبيه',onclick:()=>{b.hidden=true; bannerShown=false;}},'إخفاء'));
  b.hidden=false; bannerShown=true;
}
async function persist(promise){
  try{ await promise; return true; }
  catch(e){
    console.error('خطأ تخزين:', e);
    showBanner('تعذّر حفظ آخر تغيير على هذا الجهاز (قد تكون المساحة ممتلئة أو التخزين معطّلًا). بياناتك الحالية ما تزال ظاهرة؛ صدّر نسخة احتياطية من «المزيد ← النسخ الاحتياطي» لتفادي فقدانها.');
    return false;
  }
}
const saveSettings = () => persist(Store.put('kv',{key:'settings',value:S.settings}));
const saveTimer = () => persist(Store.put('kv',{key:'timer',value:S.timer}));
const getTask = id => S.tasks.find(t=>t.id===id);

async function upsertTask(t){
  const i = S.tasks.findIndex(x=>x.id===t.id);
  if(i>=0) S.tasks[i]=t; else S.tasks.push(t);
  refresh();
  return persist(Store.put('tasks',t));
}
async function removeTask(id){
  S.tasks = S.tasks.filter(t=>t.id!==id);
  refresh();
  return persist(Store.del('tasks',id));
}

/* ---------- 6) منطق المهام (مفصول عن الواجهة) ---------- */
const isOverdue = (t, ts=Date.now()) => { if(t.status==='done') return false; const d=dueTs(t); return d!==null && d<ts; };

function armReminders(t){
  const due = dueTs(t), n = Date.now();
  t.fired = {before:false, at:false}; t.snoozedUntil = 0;
  if(due===null || parseTime(t.dueTime)==null){ t.fired={before:true,at:true}; return t; }
  if(t.reminder.before===null || due - t.reminder.before*60000 <= n) t.fired.before = true;
  if(!t.reminder.atTime || due <= n) t.fired.at = true;
  return t;
}
function todayStats(){
  const k = dateKey(), list = S.tasks.filter(t=>t.dueDate===k);
  const done = list.filter(t=>t.status==='done').length;
  const overdueToday = list.filter(t=>isOverdue(t)).length;
  const overdue = S.tasks.filter(t=>isOverdue(t)).length;
  return {total:list.length, done, remaining:list.length-done-overdueToday, overdue, overdueToday,
          percent:list.length ? Math.round(done/list.length*100) : 0};
}
async function toggleDone(id){
  const t = getTask(id); if(!t) return;
  const wasDone = t.status==='done';
  if(wasDone){ t.status='new'; t.completedAt=null; armReminders(t); }
  else { t.status='done'; t.completedAt=Date.now(); t.snoozedUntil=0; }
  await upsertTask(t);
  toast(wasDone ? 'أُعيد فتح المهمة' : 'أحسنت! تم إكمال المهمة', 'success',
    {action:'تراجع', onAction:()=>toggleDone(id)});
}
async function setStatus(id, status){
  const t = getTask(id); if(!t) return;
  t.status = status; t.completedAt = status==='done' ? Date.now() : null;
  if(status!=='done') armReminders(t);
  await upsertTask(t);
}
function dayModel(key){
  const list = S.tasks.filter(t=>t.dueDate===key);
  const events = list.filter(t=>parseTime(t.dueTime)!=null)
    .map(t=>{ const s=parseTime(t.dueTime); return {t,s,e:s+t.duration}; })
    .sort((a,b)=>a.s-b.s || a.e-b.e);
  const untimed = list.filter(t=>parseTime(t.dueTime)==null);
  const conflicts = new Set(); let pairs = 0;
  const act = events.filter(x=>x.t.status!=='done');
  for(let i=0;i<act.length;i++) for(let j=i+1;j<act.length;j++){
    if(act[j].s < act[i].e && act[i].s < act[j].e){ conflicts.add(act[i].t.id); conflicts.add(act[j].t.id); pairs++; }
  }
  const free = []; let cur = DAY_START;
  if(key===dateKey()){ const n=new Date(); cur = Math.max(cur, Math.ceil((n.getHours()*60+n.getMinutes())/5)*5); }
  for(const ev of events){
    if(ev.s > cur && ev.s <= DAY_END && ev.s-cur>=30) free.push({s:cur,e:Math.min(ev.s,DAY_END)});
    cur = Math.max(cur, ev.e);
  }
  if(DAY_END-cur>=30) free.push({s:cur,e:DAY_END});
  return {events, untimed, conflicts, pairs, free};
}
function findConflict(task){
  const s = parseTime(task.dueTime); if(s==null || !task.dueDate) return null;
  const e = s + task.duration;
  return S.tasks.find(o=>o.id!==task.id && o.dueDate===task.dueDate && o.status!=='done' && parseTime(o.dueTime)!=null &&
    (()=>{ const os=parseTime(o.dueTime), oe=os+o.duration; return s<oe && os<e; })()) || null;
}
function sessionsOn(key){ return S.sessions.filter(x=>dateKey(new Date(x.endedAt))===key); }
function addSamples(){

    out.push({title,category,priority,duration,description,dueDate:dateKey(d),dueTime:`${pad(d.getHours())}:${pad(d.getMinutes())}`});
  });

/* ---------- 7) الطبقات (نوافذ سفلية وحوارات) مع دعم زر الرجوع ---------- */
const layers = []; let popSkip = 0, carry = false;
function openLayer(kind, build, opts={}){
  const root = $('#layers');
  const overlay = h('div',{class:'overlay '+kind});
  const box = h('div',{class:kind==='dialog'?'dialog-box':'sheet',role:kind==='dialog'?'alertdialog':'dialog','aria-modal':'true',tabindex:'-1'});
  overlay.append(box);
  const layer = {el:overlay, onClose:opts.onClose, pushed:false, prevFocus:document.activeElement};
  const api = {el:box, close:(o)=>closeLayer(layer,o), layer};
  if(carry){ layer.pushed = true; carry = false; }
  else { try{ history.pushState({layer:true},''); layer.pushed = true; }catch{} }
  build(box, api);
  if(kind==='sheet' && opts.dismiss!==false)
    overlay.addEventListener('pointerdown', e=>{ if(e.target===overlay) api.close(); });
  layers.push(layer); root.appendChild(overlay);
  requestAnimationFrame(()=>overlay.classList.add('show'));
  const af = box.querySelector('[data-autofocus]'); setTimeout(()=>{ (af||box).focus({preventScroll:true}); }, 60);
  return api;
}
function closeLayer(layer, o={}){
  const i = layers.indexOf(layer); if(i<0) return;
  layers.splice(i,1); layer.el.remove();
  try{ layer.onClose && layer.onClose(); }catch(e){ console.error(e); }
  try{ layer.prevFocus && layer.prevFocus.isConnected && layer.prevFocus.focus({preventScroll:true}); }catch{}
  if(o.fromPop || !layer.pushed) return;
  if(o.carry){ carry = true; setTimeout(()=>{ if(carry){ carry=false; popSkip++; try{history.back();}catch{popSkip--;} } },0); return; }
  popSkip++; try{ history.back(); }catch{ popSkip--; }
}
function closeAllLayers(){ while(layers.length) closeLayer(layers[layers.length-1]); }
function confirmDialog({title, message, okText='تأكيد', danger=false}){
  return new Promise(resolve=>{
    let done=false; const fin = v => { if(!done){ done=true; resolve(v); } };
    openLayer('dialog',(box,api)=>{
      box.append(h('h2',{style:'font-size:1.15rem'},title), h('p',{class:'muted'},message),
        h('div',{class:'flex',style:'margin-top:6px'},
          h('button',{class:'btn '+(danger?'danger':'primary'),type:'button','data-autofocus':'',style:'flex:1',onclick:()=>{fin(true);api.close();}},okText),
          h('button',{class:'btn',type:'button',style:'flex:1',onclick:()=>{fin(false);api.close();}},'إلغاء')));
    },{onClose:()=>fin(false)});
  });
}

/* ---------- 8) التنبيهات السريعة (Toast) ---------- */
function toast(msg, type='success', o={}){
  const box = $('#toasts');
  const el = h('div',{class:'toast '+(type==='success'?'':type)}, h('span',{class:'grow'},msg));
  let timer;
  const kill = () => { clearTimeout(timer); el.remove(); };
  if(o.action) el.append(h('button',{type:'button',onclick:()=>{ kill(); o.onAction&&o.onAction(); }},o.action));
  box.append(el);
  while(box.children.length>3) box.firstChild.remove();
  timer = setTimeout(kill, o.duration || (o.action?5000:3200));
}

function filteredTasks(){
  const q = norm(S.ui.taskQuery.trim()), f = S.ui.taskFilter;
  const list = S.tasks.filter(t=>{
    if(q && !(norm(t.title).includes(q) || norm(t.description).includes(q))) return false;
    if(f==='new') return t.status==='new'; if(f==='inprogress') return t.status==='inprogress';
    if(f==='done') return t.status==='done'; if(f==='overdue') return isOverdue(t); return true;
  });
  const due = t => dueTs(t) ?? 1e18, dn = t => t.status==='done' ? 1 : 0;
  const by = S.ui.taskSort;
  list.sort((a,b)=>{
    if(by==='created') return b.createdAt-a.createdAt;
    if(dn(a)!==dn(b)) return dn(a)-dn(b);
    if(by==='priority') return PRIORITIES[b.priority].rank-PRIORITIES[a.priority].rank || due(a)-due(b);
    return due(a)-due(b) || PRIORITIES[b.priority].rank-PRIORITIES[a.priority].rank;
  });
  return list;
}

const TM = {}; let timerTimeout = null, audioCtx = null, wakeLock = null;
const modeMs = mode => (mode==='focus'?S.settings.focusMin:mode==='short'?S.settings.shortMin:S.settings.longMin)*60000;
const MODE_LABEL = {focus:'وقت التركيز',short:'استراحة قصيرة',long:'استراحة طويلة'};
function defaultTimer(){ const ms=modeMs('focus'); return {mode:'focus',status:'idle',totalMs:ms,remainingMs:ms,endAt:0,startedAt:0,taskId:null,cycle:0}; }
function normalizeTimer(t){
  const d = defaultTimer(); if(!t||typeof t!=='object') return d;
  const mode = ENUM(t.mode,MODE_LABEL,'focus'), st = ['idle','running','paused'].includes(t.status)?t.status:'idle';
  const total = num(t.totalMs,1000,6e6*60,modeMs(mode));
  return {mode, status:st, totalMs:total, remainingMs:num(t.remainingMs,0,total,total), endAt:num(t.endAt,0,MAXTS,0), startedAt:num(t.startedAt,0,MAXTS,0),
    taskId:typeof t.taskId==='string'?t.taskId:null, cycle:num(t.cycle,0,1e6,0)};
}
const timerRemaining = () => S.timer.status==='running' ? Math.max(0,S.timer.endAt-Date.now()) : S.timer.remainingMs;
function unlockAudio(){ try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }catch{} }
function beep(){
  if(!S.settings.soundOn || !audioCtx) return;
  try{
    const t0 = audioCtx.currentTime;
    [0,.28,.56].forEach((o,i)=>{
      const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
      osc.type='sine'; osc.frequency.value = i===2?988:784;
      g.gain.setValueAtTime(.0001,t0+o); g.gain.exponentialRampToValueAtTime(.25,t0+o+.03); g.gain.exponentialRampToValueAtTime(.0001,t0+o+.24);
      osc.connect(g); g.connect(audioCtx.destination); osc.start(t0+o); osc.stop(t0+o+.26);
    });
  }catch{}
}
async function requestWake(){

    wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{ wakeLock=null; }); } }catch{ wakeLock=null; }
}
function releaseWake(){ try{ wakeLock && wakeLock.release(); }catch{} wakeLock=null; }
function setTimerMode(mode){

}

}

async function timerEnd(){

function timerReset(){ timerToIdle(); toast('أُعيد ضبط المؤقت','info'); }

function download(filename, mime, content){
  const url = URL.createObjectURL(new Blob([content],{type:mime}));
  const a = h('a',{href:url,download:filename,style:'display:none'}); document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),15000);
}
const snapshot = () => ({app:'monazemi',schemaVersion:1,appVersion:APP_VERSION,exportedAt:new Date().toISOString(),tasks:S.tasks,sessions:S.sessions,settings:S.settings});
function exportJSON(){ download(`monazemi-backup-${dateKey()}.json`,'application/json;charset=utf-8',JSON.stringify(snapshot(),null,2)); toast('تم تصدير النسخة الاحتياطية'); }
function csvCell(v){
  let s = String(v??''); if(/^[=+\-@\t\r]/.test(s)) s = "'"+s;  // حماية من حقن الصيغ في جداول البيانات
  return '"'+s.replace(/"/g,'""')+'"';
}
function exportCSV(){
  const head = ['المعرّف','العنوان','الوصف','الحالة','الأولوية','التصنيف','تاريخ الإنشاء','تاريخ الاستحقاق','الوقت','المدة (دقيقة)','تاريخ الإكمال','تذكير قبل (دقيقة)','تذكير عند الموعد'];
  const rows = S.tasks.map(t=>[t.id,t.title,t.description,STATUS[t.status],PRIORITIES[t.priority].label,CATEGORIES[t.category],new Date(t.createdAt).toISOString(),t.dueDate,t.dueTime,t.duration,t.completedAt?new Date(t.completedAt).toISOString():'',t.reminder.before??'',t.reminder.atTime?'نعم':'لا']);
  const csv = '\uFEFF' + [head,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n');
  download(`monazemi-tasks-${dateKey()}.csv`,'text/csv;charset=utf-8',csv); toast('تم تصدير المهام إلى CSV');
}
function parseBackup(text){
  if(text.length > 8*1024*1024) throw new Error('الملف كبير جدًا (الحد 8 ميجابايت).');
  let data; try{ data = JSON.parse(text); }catch{ throw new Error('الملف ليس JSON صالحًا.'); }
  if(!data || typeof data!=='object' || Array.isArray(data) || data.app!=='monazemi') throw new Error('هذا الملف ليس نسخة احتياطية من «منظمي».');
  if(!Array.isArray(data.tasks)) throw new Error('بنية الملف غير صحيحة: قائمة المهام مفقودة.');
  if(data.sessions!==undefined && !Array.isArray(data.sessions)) throw new Error('بنية الملف غير صحيحة: سجل الجلسات.');
  if(data.tasks.length>20000 || (data.sessions||[]).length>50000) throw new Error('عدد العناصر في الملف أكبر من المسموح.');
  const seen = new Set(), tasks = []; let skipped = 0;
  for(const raw of data.tasks){ const t=normalizeTask(raw); if(!t || seen.has(t.id)){ skipped++; continue; } seen.add(t.id); tasks.push(t); }
  const sseen = new Set(), sessions = [];
  for(const raw of (data.sessions||[])){ const s=normalizeSession(raw); if(!s || sseen.has(s.id)){ skipped++; continue; } sseen.add(s.id); sessions.push(s); }
  if(!tasks.length && data.tasks.length) throw new Error('لا توجد مهام صالحة في الملف.');
  return {tasks, sessions, settings:normalizeSettings(data.settings), skipped};
}
async function importFromFile(file){
  if(!file) return;
  if(file.size > 8*1024*1024){ toast('الملف كبير جدًا','error'); return; }
  let text; try{ text = await file.text(); }catch{ toast('تعذّرت قراءة الملف','error'); return; }
  let parsed; try{ parsed = parseBackup(text); }catch(e){ toast(e.message,'error',{duration:5000}); return; }
  const ok = await confirmDialog({title:'استيراد نسخة احتياطية',
    message:`سيتم استبدال بياناتك الحالية (${S.tasks.length} مهمة) بـ ${parsed.tasks.length} مهمة و${parsed.sessions.length} جلسة من الملف${parsed.skipped?` (تم تجاهل ${parsed.skipped} عنصرًا غير صالح)`:''}. ستُحفظ نسخة من بياناتك الحالية تلقائيًا لتتمكن من استرجاعها.`,okText:'استبدال'});
  if(!ok) return;
  await persist(Store.put('kv',{key:'preImportBackup',value:{at:Date.now(),data:snapshot()}}));
  S.tasks = parsed.tasks; S.sessions = parsed.sessions; S.settings = parsed.settings;
  S.tasks.forEach(t=>{ if(t.status!=='done' && !(t.fired.before&&t.fired.at)) {/* تُحفظ حالة التذكير كما في الملف */} });
  S.timer = defaultTimer(); clearTimeout(timerTimeout);
  await persist(Store.replaceAll('tasks',S.tasks)); await persist(Store.replaceAll('sessions',S.sessions));
  await saveSettings(); await saveTimer(); applyTheme(); refresh(); toast('تم استيراد النسخة الاحتياطية بنجاح');
}
async function restorePreImport(){
  let rec = null; try{ rec = (await Store.getAll('kv')).find(x=>x.key==='preImportBackup'); }catch{}
  if(!rec || !rec.value){ toast('لا توجد نسخة سابقة للاسترجاع','warn'); return; }
  if(!await confirmDialog({title:'استرجاع النسخة السابقة',message:`سيتم استبدال البيانات الحالية بالنسخة المحفوظة قبل آخر استيراد (${fmtStamp(rec.value.at)}).`,okText:'استرجاع'})) return;
  let parsed; try{ parsed = parseBackup(JSON.stringify(rec.value.data)); }catch(e){ toast('النسخة السابقة تالفة: '+e.message,'error'); return; }
  S.tasks=parsed.tasks; S.sessions=parsed.sessions; S.settings=parsed.settings; S.timer=defaultTimer();
  await persist(Store.replaceAll('tasks',S.tasks)); await persist(Store.replaceAll('sessions',S.sessions)); await saveSettings(); await saveTimer(); applyTheme(); refresh(); toast('تم استرجاع النسخة السابقة');
}
async function deleteAll(){

document.addEventListener('pointerdown', unlockAudio, {once:true, passive:true});
function syncVV(){ const vv=window.visualViewport; document.documentElement.style.setProperty('--vvh',(vv?vv.height:window.innerHeight)+'px'); }
if(window.visualViewport){ window.visualViewport.addEventListener('resize',syncVV); } window.addEventListener('resize',syncVV); syncVV();

let minuteTick = 0;
function globalTick(){
  tickClock(); checkReminders(); updateNowLine();
  if(++minuteTick%2===0 && !layers.length){ const s=S.ui.screen; if(s==='home'||s==='tasks') refresh(); } else updateNavBadges();
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) return;
  if(S.timer.status==='running'){ timerTick(); requestWake(); }
  checkReminders(); tickClock(); updateNowLine();
});

async function init(){
  $('#splashLogo').append(icon('logo',48));
  const mode = await Store.init();
  let tasks=[], sessions=[], kv=[];
  try{ [tasks,sessions,kv] = await Promise.all([Store.getAll('tasks'),Store.getAll('sessions'),Store.getAll('kv')]); }
  catch(e){ console.error(e); showBanner('تعذّرت قراءة البيانات المحفوظة. إن استمرت المشكلة فأعد تحميل الصفحة قبل إضافة بيانات جديدة حتى لا تُستبدل البيانات القديمة.'); }
  if(mode==='mem') showBanner('تعذّر الوصول إلى التخزين الدائم في هذا المتصفح (ربما وضع التصفح الخاص). ستعمل البيانات مؤقتًا فقط، فصدّر نسخة احتياطية قبل الإغلاق.');
  const kvMap = Object.fromEntries(kv.map(x=>[x.key,x.value]));
  S.settings = normalizeSettings(kvMap.settings);
  S.tasks = tasks.map(normalizeTask).filter(Boolean);
  S.sessions = sessions.map(normalizeSession).filter(Boolean);
  S.timer = normalizeTimer(kvMap.timer);
  if(S.timer.status==='idle'){ S.timer.totalMs = S.timer.remainingMs = modeMs(S.timer.mode); }
  applyTheme(); buildNav(); buildTasksScreen(); buildScheduleScreen(); buildTimerScreen();
  const hash = location.hash.slice(1), first = ALL_SCREENS.includes(hash) ? hash : 'home';
  try{ history.replaceState({screen:first},'','#'+first); }catch{}
  showScreen(first);
  /* استعادة المؤقت بعد إعادة فتح الصفحة */
  if(S.timer.status==='running'){
    if(S.timer.endAt<=Date.now()) timerComplete({recovered:true, endedAt:S.timer.endAt});
    else { scheduleTimerTick(); requestWake(); }
  }
  $('#app').hidden = false;
  const sp = $('#splash'); sp.classList.add('out'); setTimeout(()=>sp.remove(),400);
  showScreen(S.ui.screen);
  setTimeout(()=>{ checkReminders(); },800);
  setInterval(globalTick, 30000); setInterval(tickClock, 1000);
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch{}
}
/* تسجيل Service Worker (يعمل فقط على HTTPS أو localhost) لتمكين التثبيت والعمل دون إنترنت */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(e=>console.warn('تعذّر تسجيل Service Worker:',e)); });
}
init().catch(e=>{ console.error(e); document.getElementById('splash').innerHTML='<p style="padding:24px;text-align:center">تعذّر تشغيل التطبيق. أعد تحميل الصفحة.</p>'; });
})();
</script>
</body>
</html>
